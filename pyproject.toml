[project]
name = "aiml-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lm-eval[api,ifeval]>=0.4.13",
    "ollama>=0.6.3",
    "openpyxl==3.1.5",
]

[dependency-groups]
# scripts/nvfp4_quantization.py (NVFP4 checkpoints with llm-compressor, served by vLLM). Not installed by a
# plain `uv sync`, so the benchmark setup stays light (CLAUDE.md: no torch in the root env by default):
#   uv run --group quantize scripts/nvfp4_quantization.py Qwen/Qwen3-4B
# llmcompressor 0.15.0 caps torch at 2.14.1 and transformers at 5.21.0; it pulls in both, plus datasets.
quantize = [
    "llmcompressor==0.15.0",
]

# basedpyright also reads [tool.pyright]; venv settings let plain Pyright find the uv environment.
[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 80
